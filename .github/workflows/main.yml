
name: Build Kindle WhatsApp Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find plugin files
        run: |
          find . -type f
          echo "Searching for plugin entry point..."
          find . -name "main.lua"

      - name: Package plugin
        run: |
          mkdir -p output
          ROOT=$(find . -type f -name "main.lua" \
            -not -path "./.git/*" | head -n 1 | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "main.lua not found!"
            exit 1
          fi

          NAME=$(basename "$ROOT")
          cp -r "$ROOT" "output/${NAME}"

          cd output
          zip -r "../WhatsApp-KOReader.zip" "${NAME}"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-KOReader-Plugin
          path: WhatsApp-KOReader.zip
